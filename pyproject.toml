[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "controlled-experiment-demo"
version = "1.0.0"
description = "A minimal, reproducible controlled experiment simulation with verification"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["experiment", "simulation", "reproducible", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Source = "https://github.com/virtual-town/controlled-experiment-demo"
